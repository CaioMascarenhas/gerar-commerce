name: Integração contínua
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-fund --no-audit
      - run: npm run build
      - run: npm test
      - run: npm run test:e2e:types
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
      - run: node .github/scripts/e2e.mjs
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: e2e-browser-evidence
          path: frontend/.e2e-artifacts/
          include-hidden-files: true
          retention-days: 7
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: gerar
          POSTGRES_PASSWORD: gerar_local
          POSTGRES_DB: gerar_commerce
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U gerar -d gerar_commerce"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://gerar:gerar_local@127.0.0.1:5432/gerar_commerce
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci --no-fund --no-audit
      - run: npm run build
      - run: npm test
      - run: npm run smoke
  documentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
      - run: node .github/scripts/check-docs.mjs
